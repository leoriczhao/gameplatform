[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gameplatform-sdk"
version = "1.0.0"
description = "Python SDK for Stream RL games: local in-process training, OpenEnv remote envs, ONNX export, v2 match API client"
requires-python = ">=3.10"
dependencies = ["numpy", "requests", "gymnasium>=1.1", "openenv==0.4.1"]

[tool.setuptools]
packages = ["gameplatform", "gameplatform.games", "gamekernel"]
